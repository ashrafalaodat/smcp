apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-triggers
  namespace: tekton-pipelines
secrets:
  - name: registry-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-triggers
  namespace: tekton-pipelines
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns"]
    verbs: ["create", "get", "list"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns/status"]
    verbs: ["get"]
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["eventlisteners", "triggertemplates", "triggerbindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-triggers
  namespace: tekton-pipelines
subjects:
  - kind: ServiceAccount
    name: tekton-triggers
    namespace: tekton-pipelines
roleRef:
  kind: Role
  name: tekton-triggers
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-push-main
  namespace: tekton-pipelines
spec:
  params:
    - name: repoUrl
      value: $(body.repository.clone_url)
    - name: revision
      value: $(extensions.branch)
    - name: imageTag
      value: $(extensions.shortSha)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: git-image-build-template
  namespace: tekton-pipelines
spec:
  params:
    - name: repoUrl
    - name: revision
    - name: imageRepository
    - name: imageTag
    - name: dockerfile
      default: Dockerfile
    - name: contextPath
      default: .
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: git-image-build-
      spec:
        serviceAccountName: tekton-image-builder
        pipelineRef:
          name: git-image-build
        params:
          - name: repo_url
            value: $(tt.params.repoUrl)
          - name: revision
            value: $(tt.params.revision)
          - name: image_url
            value: $(tt.params.imageRepository):$(tt.params.imageTag)
          - name: dockerfile
            value: $(tt.params.dockerfile)
          - name: context_path
            value: $(tt.params.contextPath)
        workspaces:
          - name: source
            emptyDir: {}
          - name: dockerconfig
            secret:
              secretName: registry-credentials
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: github-image-listener
  namespace: tekton-pipelines
spec:
  serviceAccountName: tekton-triggers
  resources:
    kubernetesResource:
      serviceType: ClusterIP
  triggers:
    - name: github-main-image-build
      serviceAccountName: tekton-triggers
      interceptors:
        - ref:
            kind: ClusterInterceptor
            name: github
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value:
                - push
        - ref:
            kind: ClusterInterceptor
            name: cel
          params:
            - name: filter
              value: "body.ref == 'refs/heads/main'"
            - name: overlays
              value:
                - key: branch
                  expression: "split(body.ref, '/')[2]"
                - key: shortSha
                  expression: "body.after.substring(0,7)"
      bindings:
        - ref: github-push-main
      template:
        ref: git-image-build-template
      params:
        - name: imageRepository
          value: ghcr.io/example-org/sample-app
        - name: dockerfile
          value: Dockerfile
        - name: contextPath
          value: .
