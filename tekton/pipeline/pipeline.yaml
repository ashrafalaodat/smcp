apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-image-builder
  namespace: tekton-pipelines
secrets:
  - name: registry-credentials
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: git-image-build
  namespace: tekton-pipelines
spec:
  description: |
    Clones a git repository and builds/pushes a container image with Kaniko.
  params:
    - name: repo_url
      description: Git repository to clone
    - name: revision
      description: Git ref (branch, tag, or SHA)
      default: main
    - name: image_url
      description: Fully-qualified image (registry.example.com/app:tag)
    - name: dockerfile
      description: Relative path to the Dockerfile within the repo
      default: Dockerfile
    - name: context_path
      description: Relative build context directory
      default: .
  workspaces:
    - name: source
      description: Holds the cloned repository
    - name: dockerconfig
      description: Contains a dockerconfigjson secret for Kaniko pushes
  tasks:
    - name: fetch-source
      params:
        - name: repo_url
          value: $(params.repo_url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        params:
          - name: repo_url
            description: Git repository to clone
          - name: revision
            description: Git reference to checkout
        workspaces:
          - name: source
        steps:
          - name: clone
            image: alpine/git:2.45.2
            script: |
              #!/bin/sh
              set -eu
              rm -rf "$(workspaces.source.path)/src"
              git clone --depth 1 --branch "$(params.revision)" "$(params.repo_url)" "$(workspaces.source.path)/src"
              cd "$(workspaces.source.path)/src"
              git rev-parse HEAD
    - name: build-and-push
      runAfter:
        - fetch-source
      params:
        - name: image_url
          value: $(params.image_url)
        - name: dockerfile
          value: $(params.dockerfile)
        - name: context_path
          value: $(params.context_path)
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: dockerconfig
      taskSpec:
        params:
          - name: image_url
          - name: dockerfile
          - name: context_path
        workspaces:
          - name: source
          - name: dockerconfig
        steps:
          - name: build
            image: gcr.io/kaniko-project/executor:v1.23.2
            env:
              - name: DOCKER_CONFIG
                value: $(workspaces.dockerconfig.path)
            args:
              - --context=$(workspaces.source.path)/src/$(params.context_path)
              - --dockerfile=$(workspaces.source.path)/src/$(params.dockerfile)
              - --destination=$(params.image_url)
              - --snapshotMode=redo
              - --push-retry=3
              - --use-new-run
