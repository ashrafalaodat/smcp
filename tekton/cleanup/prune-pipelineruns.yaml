apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-prune
  namespace: oci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-prune
  namespace: oci
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-prune
  namespace: oci
subjects:
  - kind: ServiceAccount
    name: tekton-prune
    namespace: oci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-prune
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tekton-prune-pipelineruns
  namespace: oci
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: tekton-prune
          restartPolicy: OnFailure
          containers:
            - name: prune
              image: bitnami/kubectl:1.30.2
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  install_packages jq >/dev/null
                  threshold=$(($(date -u +%s) - 86400))
                  kubectl get pipelineruns.tekton.dev -n oci -o json \
                    | jq -r --argjson threshold "$threshold" '
                        .items[]
                        | select(.status.completionTime != null)
                        | select((.status.completionTime | fromdateiso8601) < $threshold)
                        | .metadata.name
                      ' \
                    | xargs -r kubectl delete pipelineruns.tekton.dev -n oci
