apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-prune
  namespace: oci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-prune
  namespace: oci
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-prune
  namespace: oci
subjects:
  - kind: ServiceAccount
    name: tekton-prune
    namespace: oci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-prune
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tekton-prune-pipelineruns
  namespace: oci
spec:
  # run once per day at 00:00
  schedule: "0 0 * * *"

  # do not start a new Job if the previous one is still running
  concurrencyPolicy: Forbid

  # keep at most 1 succeeded / 1 failed job in history
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1

  jobTemplate:
    spec:
      # how many times to retry the Job before marking it failed
      backoffLimit: 3
      # auto-cleanup finished Jobs (succeeded or failed) after 1 hour
      ttlSecondsAfterFinished: 3600

      template:
        metadata: {}
        spec:
          serviceAccountName: tekton-prune
          restartPolicy: OnFailure
          dnsPolicy: ClusterFirst
          schedulerName: default-scheduler
          terminationGracePeriodSeconds: 30
          securityContext: {}
          containers:
            - name: prune
              image: bitnami/kubectl:1.30.2
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  install_packages jq >/dev/null
                  threshold=$(($(date -u +%s) - 86400))
                  kubectl get pipelineruns.tekton.dev -n oci -o json \
                    | jq -r --argjson threshold "$threshold" '
                        .items[]
                        | select(.status.completionTime != null)
                        | select((.status.completionTime | fromdateiso8601) < $threshold)
                        | .metadata.name
                      ' \
                    | xargs -r kubectl delete pipelineruns.tekton.dev -n oci
