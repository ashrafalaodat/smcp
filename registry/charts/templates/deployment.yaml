apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "registry.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "registry.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "registry.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "registry.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: registry
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MCP_QDRANT_HOST
              value: {{ .Values.env.qdrantHost | quote }}
            - name: MCP_QDRANT_PORT
              value: {{ .Values.env.qdrantPort | quote }}
            - name: MCP_QDRANT_API_KEY
              value: {{ .Values.env.qdrantAPIKey | quote }}
            - name: MCP_QDRANT_COLLECTION
              value: {{ .Values.env.qdrantCollection | quote }}
            - name: MCP_QDRANT_EMBEDDING_DIM
              value: {{ .Values.env.embeddingDim | quote }}
            - name: MCP_QDRANT_DEFAULT_VISIBILITY
              value: {{ .Values.env.defaultVisibility | quote }}
            - name: MCP_QDRANT_HTTP_ADDRESS
              value: {{ .Values.env.httpAddress | quote }}
            - name: MCP_QDRANT_VECTORIZE_URL
              value: {{ .Values.env.vectorizeURL | quote }}
            - name: MCP_QDRANT_VECTORIZE_API_KEY
              value: {{ .Values.env.vectorizeAPIKey | quote }}
            - name: MCP_QDRANT_VECTORIZE_MODEL
              value: {{ .Values.env.vectorizeModel | quote }}
          ports:
            - containerPort: 8080
              name: http
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
