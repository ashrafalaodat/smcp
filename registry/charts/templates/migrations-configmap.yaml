{{- if and .Values.migrations.enabled .Values.migrations.script }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "registry.fullname" . }}-migrations
  labels:
    app.kubernetes.io/name: {{ include "registry.name" . }}
    helm.sh/chart: {{ include "registry.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  schema.sql: |
{{- .Values.migrations.script | nindent 4 }}
{{- end }}
