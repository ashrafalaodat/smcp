apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: math
  namespace: default
  labels:
    function.knative.dev: "true"
    function.knative.dev/name: math
    function.knative.dev/runtime: go
spec:
  template:
    metadata:
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: math
        dapr.io/app-port: "8080"
        dapr.io/metrics-port: "9092"
        ksyncer/description: "Performs basic arithmetic (+, -, *, /, power) on two numbers."
        ksyncer/inputs: '[{"name":"a","type":"number","required":true},{"name":"b","type":"number","required":true},{"name":"op","type":"string","required":true,"enum":["add","subtract","multiply","divide","power"]}]'
        ksyncer/outputs: '[{"name":"result","type":"number"},{"name":"operation","type":"string"}]'
    spec:
      containers:
        - name: user-container
          image: 10.96.27.199:5000/math:4ea5af3-20251126111542 # {"$imagepolicy": "flux-system:math-policy"}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          readinessProbe:
            httpGet: { path: /health/readiness, port: 0 }
          livenessProbe:
            httpGet: { path: /health/liveness, port: 0 }
      imagePullSecrets:
        - name: oci-registry-distribution-dockerconfig
