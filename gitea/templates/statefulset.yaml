apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gitea.fullname" . }}
  labels:
    {{- include "gitea.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "gitea.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gitea.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gitea.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "gitea.serviceAccountName" . }}
      containers:
        - name: gitea
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
            - name: ssh
              containerPort: 22
          env:
{{ include "gitea.env" . | nindent 12 }}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    set -euo pipefail
                    CONFIG="${GITEA_APP_INI:-/data/gitea/conf/app.ini}"
                    i=0
                    while [ $i -lt 60 ]; do
                      if [ -f "$CONFIG" ]; then
                        break
                      fi
                      i=$((i+1))
                      sleep 2
                    done
                    if [ ! -f "$CONFIG" ]; then
                      echo "Gitea config $CONFIG not found" >&2
                      exit 1
                    fi
                    i=0
                    while [ $i -lt 60 ]; do
                      if gitea admin user list --config "$CONFIG" >/tmp/gitea-users 2>&1; then
                        break
                      fi
                      i=$((i+1))
                      sleep 2
                    done
                    if ! gitea admin user change-password --username "$GITEA_ADMIN_USERNAME" --password "$GITEA_ADMIN_PASSWORD" --config "$CONFIG"; then
                      gitea admin user create --username "$GITEA_ADMIN_USERNAME" --password "$GITEA_ADMIN_PASSWORD" --email "$GITEA_ADMIN_EMAIL" --admin --must-change-password=false --config "$CONFIG"
                    fi
          volumeMounts:
            - name: config
              mountPath: /etc/gitea/conf
            - name: data
              mountPath: /data
{{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
{{- end }}
{{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
{{- end }}
      volumes:
        - name: config
          emptyDir: {}
{{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
{{- end }}
{{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
{{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName }}
{{- end }}
{{- end }}
