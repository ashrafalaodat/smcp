{{- if .Values.admin.createSecret }}
{{- $password := randAlphaNum 32 -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gitea.adminSecretName" . }}
  labels:
    {{- include "gitea.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.admin.secretKey }}: {{ $password }}
{{- end }}
