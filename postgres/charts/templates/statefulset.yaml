apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "postgres.fullname" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "postgres.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "postgres.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "postgres.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
{{ toYaml . | indent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
{{ toYaml . | indent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: {{ .Values.service.port }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.primary.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.primary.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "postgres.fullname" .) .Values.primary.passwordSecretName }}
                  key: {{ .Values.primary.passwordSecretKey }}
          {{- with .Values.extraEnv }}
{{ toYaml . | indent 10 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          {{- if .Values.initdb.enabled }}
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          {{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
{{ toYaml .Values.securityContext | indent 12 }}
      {{- if or .Values.permissionsInit.enabled (or .Values.initdb.enabled (gt (len .Values.initContainers) 0)) }}
      initContainers:
        {{- if .Values.permissionsInit.enabled }}
        - name: {{ default "fix-permissions" .Values.permissionsInit.name }}
          image: {{ .Values.permissionsInit.image | quote }}
          imagePullPolicy: {{ default "IfNotPresent" .Values.permissionsInit.pullPolicy }}
          command:
{{ toYaml .Values.permissionsInit.command | indent 12 }}
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
        {{- end }}
        {{- if .Values.initContainers }}
{{ toYaml .Values.initContainers | indent 8 }}
        {{- end }}
        {{- if .Values.initdb.enabled }}
        - name: init-extensions
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /initdb
              cp -R /docker-entrypoint-initdb.d/* /initdb/ || true
          volumeMounts:
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          {{- end }}
      {{- end }}
      volumes:
        {{- if .Values.initdb.enabled }}
        - name: init-scripts
          configMap:
            name: {{ include "postgres.fullname" . }}-init
        {{- end }}
{{- if .Values.extraVolumes }}
{{ toYaml .Values.extraVolumes | indent 8 }}
{{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: {{ include "postgres.name" . }}
          app.kubernetes.io/instance: {{ .Release.Name }}
      spec:
        accessModes: {{ toYaml .Values.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
