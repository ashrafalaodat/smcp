{{- if and .Values.primary.passwordSecretName (not .Values.initdb.enabled) }}
# Password secret managed externally; no template generated.
{{- else if not .Values.primary.passwordSecretName }}
{{- $password := randAlphaNum 32 -}}
{{- $port := int .Values.service.port -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres.fullname" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password }}
  username: {{ .Values.primary.username | quote }}
  database: {{ .Values.primary.database | quote }}
  host: {{ include "postgres.fullname" . | quote }}
  port: {{ printf "%d" $port | quote }}
  uri: {{ printf "postgres://%s:%s@%s:%d/%s?sslmode=disable" .Values.primary.username $password (include "postgres.fullname" .) $port .Values.primary.database | quote }}
{{- end }}
