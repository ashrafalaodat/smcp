replicaCount: 1

image:
  repository: docker.io/pgvector/pgvector
  tag: "pg16"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}

podLabels: {}

podSecurityContext:
  fsGroup: 999

securityContext:
  runAsUser: 999
  runAsGroup: 999
  runAsNonRoot: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 5432

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  storageClass: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

nodeSelector: {}

tolerations: []

affinity: {}

primary:
  database: registry
  username: registry
  passwordSecretName: ""
  passwordSecretKey: password

extensions:
  enabled: true
  list:
    - uuid-ossp
    - pg_trgm
    - pgvector

backups:
  enabled: false
  schedule: ""  # cron expression
  retention: 7

extraEnv: []

metrics:
  enabled: false
  image:
    repository: wrouesnel/postgres_exporter
    tag: latest
    pullPolicy: IfNotPresent
  port: 9187

initdb:
  enabled: true
  scripts:
    01-extensions.sql: |
      CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
      CREATE EXTENSION IF NOT EXISTS pg_trgm;
      DO $$
      BEGIN
        CREATE EXTENSION IF NOT EXISTS vector;
      EXCEPTION
        WHEN undefined_file THEN
          RAISE NOTICE 'pgvector extension not available, skipping';
      END
      $$;
    02-schema.sql: |
      CREATE TABLE IF NOT EXISTS tools (
        id UUID PRIMARY KEY,
        owner TEXT NOT NULL,
        name TEXT NOT NULL,
        description TEXT NOT NULL,
        embedding vector,
        inputs JSONB NOT NULL DEFAULT '{}'::jsonb,
        outputs JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL,
        updated_at TIMESTAMPTZ NOT NULL
      );
      ALTER TABLE tools ALTER COLUMN owner SET NOT NULL;
      ALTER TABLE tools ALTER COLUMN name SET NOT NULL;
      ALTER TABLE tools ALTER COLUMN description SET NOT NULL;
      DO $$
      BEGIN
        IF EXISTS (SELECT 1 FROM tools WHERE embedding IS NULL) THEN
          RAISE EXCEPTION 'tools.embedding contains NULL values. Populate embeddings before upgrading.';
        END IF;
      END
      $$;
      ALTER TABLE tools ALTER COLUMN embedding SET NOT NULL;
      DO $$
      BEGIN
        IF NOT EXISTS (
          SELECT 1
          FROM pg_constraint
          WHERE conname = 'tools_owner_name_unique'
            AND conrelid = 'tools'::regclass
        ) THEN
          ALTER TABLE tools ADD CONSTRAINT tools_owner_name_unique UNIQUE (owner, name);
        END IF;
      END
      $$;
      CREATE INDEX IF NOT EXISTS idx_tools_owner ON tools(owner);
      CREATE INDEX IF NOT EXISTS idx_tools_name_trgm ON tools USING GIN (name gin_trgm_ops);
      CREATE INDEX IF NOT EXISTS idx_tools_description_trgm ON tools USING GIN (description gin_trgm_ops);

      CREATE TABLE IF NOT EXISTS policies (
        id UUID PRIMARY KEY,
        tool_id UUID NOT NULL REFERENCES tools(id) ON DELETE CASCADE,
        principal TEXT NOT NULL,
        allowed_scope TEXT[] NOT NULL DEFAULT '{}',
        conditions JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL
      );
      CREATE INDEX IF NOT EXISTS idx_policies_tool_id ON policies(tool_id);

      CREATE TABLE IF NOT EXISTS audit (
        id BIGSERIAL PRIMARY KEY,
        tool_id UUID NOT NULL REFERENCES tools(id) ON DELETE CASCADE,
        event_type TEXT NOT NULL,
        actor TEXT NOT NULL,
        payload JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
      );
      CREATE INDEX IF NOT EXISTS idx_audit_tool_id ON audit(tool_id);

  configMap: ""

schemaJob:
  enabled: true
  image:
    repository: docker.io/pgvector/pgvector
    tag: "pg16"
    pullPolicy: IfNotPresent
  script: |
    \set db_user :'DBUSER'
    \set db_pass :'DBPASS'
    \set db_name :'DBNAME'

    DO $$
    BEGIN
      IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = :'db_user') THEN
        EXECUTE format('CREATE ROLE %I LOGIN PASSWORD %L', :'db_user', :'db_pass');
      ELSE
        EXECUTE format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'db_user', :'db_pass');
      END IF;
    END
    $$;

    GRANT ALL PRIVILEGES ON DATABASE :"db_name" TO :"db_user";

    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
    CREATE EXTENSION IF NOT EXISTS vector;

    CREATE TABLE IF NOT EXISTS tools (
      id UUID PRIMARY KEY,
      owner TEXT NOT NULL,
      name TEXT NOT NULL,
      description TEXT NOT NULL,
      embedding vector,
      inputs JSONB NOT NULL DEFAULT '{}'::jsonb,
      outputs JSONB NOT NULL DEFAULT '{}'::jsonb,
      created_at TIMESTAMPTZ NOT NULL,
      updated_at TIMESTAMPTZ NOT NULL
    );
    ALTER TABLE tools ALTER COLUMN owner SET NOT NULL;
    ALTER TABLE tools ALTER COLUMN name SET NOT NULL;
    ALTER TABLE tools ALTER COLUMN description SET NOT NULL;
    DO $$
    BEGIN
      IF EXISTS (SELECT 1 FROM tools WHERE embedding IS NULL) THEN
        RAISE EXCEPTION 'tools.embedding contains NULL values. Populate embeddings before upgrading.';
      END IF;
    END
    $$;
    ALTER TABLE tools ALTER COLUMN embedding SET NOT NULL;
    DO $$
    BEGIN
      IF NOT EXISTS (
        SELECT 1
        FROM pg_constraint
        WHERE conname = 'tools_owner_name_unique'
          AND conrelid = 'tools'::regclass
      ) THEN
        ALTER TABLE tools ADD CONSTRAINT tools_owner_name_unique UNIQUE (owner, name);
      END IF;
    END
    $$;
    CREATE INDEX IF NOT EXISTS idx_tools_owner ON tools(owner);
    CREATE INDEX IF NOT EXISTS idx_tools_name_trgm ON tools USING GIN (name gin_trgm_ops);
    CREATE INDEX IF NOT EXISTS idx_tools_description_trgm ON tools USING GIN (description gin_trgm_ops);

    CREATE TABLE IF NOT EXISTS policies (
      id UUID PRIMARY KEY,
      tool_id UUID NOT NULL REFERENCES tools(id) ON DELETE CASCADE,
      principal TEXT NOT NULL,
      allowed_scope TEXT[] NOT NULL DEFAULT '{}',
      conditions JSONB NOT NULL DEFAULT '{}'::jsonb,
      created_at TIMESTAMPTZ NOT NULL
    );
    CREATE INDEX IF NOT EXISTS idx_policies_tool_id ON policies(tool_id);

    CREATE TABLE IF NOT EXISTS audit (
      id BIGSERIAL PRIMARY KEY,
      tool_id UUID NOT NULL REFERENCES tools(id) ON DELETE CASCADE,
      event_type TEXT NOT NULL,
      actor TEXT NOT NULL,
      payload JSONB NOT NULL DEFAULT '{}'::jsonb,
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_audit_tool_id ON audit(tool_id);

permissionsInit:
  enabled: true
  name: fix-permissions
  image: docker.io/library/busybox:1.36
  pullPolicy: IfNotPresent
  command:
    - sh
    - -c
    - chown -R 999:999 /var/lib/postgresql/data

initContainers: []

extraVolumes: []
extraVolumeMounts: []
