{{- $entries := .Values.auth.htpasswd.entries | default list -}}
{{- if and .Values.registryCredentials.enabled (not .Values.registryCredentials.existingSecret) (gt (len $entries) 0) -}}
{{- $first := index $entries 0 -}}
{{- $username := default "" $first.username -}}
{{- $password := default "" $first.password -}}
{{- if and $username $password -}}
{{- $server := default (printf "%s:%v" (include "distribution.fullname" .) .Values.service.port) .Values.registryCredentials.server -}}
{{- $auth := printf "%s:%s" $username $password | b64enc -}}
{{- $authEntry := dict "username" $username "password" $password "auth" $auth -}}
{{- if .Values.registryCredentials.email -}}
{{- $_ := set $authEntry "email" .Values.registryCredentials.email -}}
{{- end -}}
{{- $config := dict "auths" (dict $server $authEntry) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-dockerconfig" (include "distribution.fullname" .)) .Values.registryCredentials.secretName }}
  labels:
    {{- include "distribution.labels" . | nindent 4 }}
    {{- with .Values.registryCredentials.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.registryCredentials.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $config | toJson | b64enc }}
{{- end -}}
{{- end -}}
